services:
  - type: web
    name: petution-app
    env: static
    buildCommand: node ./node_modules/vite/bin/vite.js build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
