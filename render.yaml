services:
  - type: static
    name: petution-app
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
